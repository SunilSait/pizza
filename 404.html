<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Slice & Dice Pizza & Fast Food. Let's get you back to the good stuff!">
  <title>404 — Page Not Found | Slice & Dice</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes pizza-spin {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(15deg); }
      40%  { transform: rotate(-10deg); }
      60%  { transform: rotate(8deg); }
      80%  { transform: rotate(-5deg); }
      100% { transform: rotate(0deg); }
    }
    .pizza-wobble { animation: pizza-spin 3s ease-in-out infinite; transform-origin: center; }
    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: 0.15; }
      50% { transform: scaleX(0.8); opacity: 0.08; }
    }
    .shadow-pulse { animation: shadow-pulse 3s ease-in-out infinite; }
  </style>
</head>
<body style="min-height:100svh;background:var(--bg-alt);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow-x:hidden;padding:2rem 1.25rem 1.5rem;box-sizing:border-box;">

  <!-- Ghost 404 background text -->
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;z-index:0;opacity:0.04;">
    <div style="font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(10rem,30vw,28rem);color:var(--secondary);line-height:1;">404</div>
  </div>

  <!-- Floating pizza decorations -->
  <div class="animate-float" style="position:fixed;top:15%;left:5%;opacity:0.15;pointer-events:none;z-index:0;animation-duration:6s;">
    <i class="fa-solid fa-pizza-slice" style="font-size:4rem;color:var(--primary);"></i>
  </div>
  <div class="animate-float" style="position:fixed;bottom:15%;right:8%;opacity:0.12;pointer-events:none;z-index:0;animation-duration:8s;animation-delay:2s;">
    <i class="fa-solid fa-pizza-slice" style="font-size:3rem;color:var(--primary);"></i>
  </div>

  <!-- Top-right controls -->
  <div class="floating-top-controls">
    <button id="err-dir-btn" onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction">LTR</button>
    <button onclick="toggleTheme()" class="nav-icon-btn" aria-label="Toggle theme">
      <span id="err-theme-icon">
        <i class="fa-solid fa-moon"></i>
      </span>
    </button>
  </div>

  <!-- Main Content -->
  <div style="position:relative;z-index:10;text-align:center;max-width:560px;width:100%;margin:0 auto;padding:1.5rem 0;">

    <!-- Logo -->
    <a href="index.html" class="logo-bounce" style="display:inline-flex;align-items:center;justify-content:center;gap:0.65rem;margin-bottom:2.5rem;text-decoration:none;" aria-label="Back to Slice & Dice Home">
      <div class="nav-logo-icon" style="width:46px;height:46px;">
        <i class="fa-solid fa-pizza-slice"></i>
      </div>
        <div style="display:flex;flex-direction:column;line-height:1;">
          <span class="nav-logo-name" style="font-size:1.25rem;">Slice&amp;<span>Dice</span></span>
          <span style="font-size:0.52rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);">Pizza &amp; Fast Food</span>
        </div>
    </a>

    <!-- Animated Pizza Icon -->
    <div style="position:relative;width:130px;height:130px;margin:0 auto 2rem;display:flex;align-items:center;justify-content:center;">
      <div class="pizza-wobble" style="display:flex;align-items:center;justify-content:center;width:100px;height:100px;background:rgba(232,52,28,0.1);border-radius:50%;color:var(--primary);font-size:3.5rem;">
        <i class="fa-solid fa-pizza-slice"></i>
      </div>
      <div class="shadow-pulse" style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:80px;height:12px;background:rgba(0,0,0,0.15);border-radius:50%;filter:blur(4px);"></div>
    </div>

    <div style="font-size:0.7rem;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:var(--primary);margin-bottom:1rem;">404 Error</div>

    <h1 style="font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(3rem,10vw,5.5rem);color:var(--text-base);line-height:0.95;letter-spacing:-0.02em;margin-bottom:1.25rem;">
      SLICE<br><span style="color:var(--primary);">NOT FOUND</span>
    </h1>

    <p style="color:var(--text-muted);font-size:1rem;line-height:1.8;margin-bottom:2.5rem;max-width:420px;margin-left:auto;margin-right:auto;">
      Oops! Looks like this page went missing from our kitchen. It may have been moved, renamed, or never existed. Let's get you back to the good stuff!
    </p>

    <div style="display:flex;flex-wrap:wrap;gap:0.85rem;justify-content:center;margin-bottom:3rem;">
      <a href="index.html" class="btn-primary">
        <i class="fa-solid fa-house"></i>
        Back to Home
      </a>
      <a href="menu.html" class="btn-secondary">
        <i class="fa-solid fa-utensils"></i>
        Browse Menu
      </a>
    </div>

    <!-- Quick nav links -->
    <div style="border-top:1px solid var(--border-lt);padding-top:2rem;margin-top:0.5rem;">
      <p style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-muted);margin-bottom:1rem;">Quick Navigation</p>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;max-width:340px;margin:0 auto;">
        <a href="about.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <i class="fa-solid fa-user" style="color:var(--primary);"></i>
          About Us
        </a>
        <a href="services.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <i class="fa-solid fa-motorcycle" style="color:var(--primary);"></i>
          Services
        </a>
        <a href="contact.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <i class="fa-solid fa-phone" style="color:var(--primary);"></i>
          Contact
        </a>
        <a href="login.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <i class="fa-solid fa-right-to-bracket" style="color:var(--primary);"></i>
          Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="components.js"></script>
  <script>
    const t = localStorage.getItem('sd_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = t === 'dark' || (!t && prefersDark);
    if (isDark) document.documentElement.classList.add('dark');
    if (typeof updateThemeIcons === 'function') updateThemeIcons(isDark);
    const d = localStorage.getItem('sd_dir') || 'ltr';
    document.documentElement.setAttribute('dir', d);
    const b = document.getElementById('err-dir-btn');
    if (b) b.textContent = d.toUpperCase();
  </script>
  <style>
    .dark body { background: var(--bg-dark); }
  </style>
</body>
</html>
