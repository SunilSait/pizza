<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page not found — Slice & Dice Pizza & Fast Food. Let's get you back to the good stuff!">
  <title>404 — Page Not Found | Slice & Dice</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    @keyframes pizza-spin {
      0%   { transform: rotate(0deg); }
      20%  { transform: rotate(15deg); }
      40%  { transform: rotate(-10deg); }
      60%  { transform: rotate(8deg); }
      80%  { transform: rotate(-5deg); }
      100% { transform: rotate(0deg); }
    }
    .pizza-wobble { animation: pizza-spin 3s ease-in-out infinite; transform-origin: center; }
    @keyframes shadow-pulse {
      0%, 100% { transform: scaleX(1); opacity: 0.15; }
      50% { transform: scaleX(0.8); opacity: 0.08; }
    }
    .shadow-pulse { animation: shadow-pulse 3s ease-in-out infinite; }
  </style>
</head>
<body style="min-height:100svh;background:var(--bg-alt);display:flex;align-items:flex-start;justify-content:center;position:relative;overflow-x:hidden;">

  <!-- Ghost 404 background text -->
  <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;user-select:none;z-index:0;opacity:0.04;">
    <div style="font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(10rem,30vw,28rem);color:var(--secondary);line-height:1;">404</div>
  </div>

  <!-- Floating pizza decorations -->
  <div class="animate-float" style="position:fixed;top:15%;left:5%;opacity:0.12;pointer-events:none;z-index:0;animation-duration:6s;">
    <svg width="80" height="80" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="45" fill="#E8341C" opacity="0.8"/>
      <path d="M50 15 C28 18 15 35 15 50 L50 50 Z" fill="#F7B731" opacity="0.9"/>
      <circle cx="35" cy="35" r="5" fill="white" opacity="0.8"/>
      <circle cx="60" cy="28" r="3" fill="white" opacity="0.8"/>
    </svg>
  </div>
  <div class="animate-float" style="position:fixed;bottom:15%;right:8%;opacity:0.1;pointer-events:none;z-index:0;animation-duration:8s;animation-delay:2s;">
    <svg width="60" height="60" viewBox="0 0 100 100" fill="none">
      <circle cx="50" cy="50" r="40" fill="#E8341C" opacity="0.6"/>
      <path d="M50 15 C28 18 15 35 15 50 L50 50 Z" fill="#F7B731" opacity="0.7"/>
    </svg>
  </div>

  <!-- Top-right controls -->
  <div style="position:fixed;top:1rem;right:1rem;z-index:50;display:flex;gap:0.5rem;">
    <button id="err-dir-btn" onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction">LTR</button>
    <button onclick="toggleTheme()" class="nav-icon-btn" aria-label="Toggle theme">
      <span id="err-theme-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </span>
    </button>
  </div>

  <!-- Main Content -->
  <div style="position:relative;z-index:10;text-align:center;padding:5rem 1.25rem 3rem;max-width:560px;width:100%;">

    <!-- Logo -->
    <a href="index.html" class="logo-bounce" style="display:inline-flex;align-items:center;justify-content:center;gap:0.65rem;margin-bottom:2.5rem;text-decoration:none;" aria-label="Back to Slice & Dice Home">
      <div class="nav-logo-icon" style="width:46px;height:46px;">
        <svg width="24" height="24" viewBox="0 0 64 64" fill="none">
          <path d="M32 8 C16 10 8 22 8 32 L32 32 Z" fill="white" opacity="0.9"/>
          <path d="M32 8 C48 10 56 22 56 32 L32 32 Z" fill="white" opacity="0.6"/>
          <path d="M8 32 C10 48 22 56 32 56 L32 32 Z" fill="white" opacity="0.4"/>
          <circle cx="22" cy="22" r="3" fill="white" opacity="0.95"/>
        </svg>
      </div>
      <div style="display:flex;flex-direction:column;line-height:1;text-align:left;">
        <span style="font-family:'Playfair Display',serif;font-weight:900;font-size:1.1rem;color:var(--secondary);">Slice&amp;<span style="color:var(--primary);">Dice</span></span>
        <span style="font-size:0.52rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);">Pizza &amp; Fast Food</span>
      </div>
    </a>

    <!-- Animated Pizza Icon -->
    <div style="position:relative;width:130px;height:130px;margin:0 auto 2rem;display:flex;align-items:center;justify-content:center;">
      <div class="pizza-wobble">
        <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
          <circle cx="50" cy="50" r="46" fill="#E8341C" opacity="0.12"/>
          <circle cx="50" cy="50" r="42" fill="var(--primary)"/>
          <path d="M50 12 C26 16 12 32 12 50 L50 50 Z" fill="#F7B731" opacity="0.9"/>
          <circle cx="50" cy="50" r="8" fill="rgba(255,255,255,0.15)"/>
          <circle cx="32" cy="32" r="5" fill="white" opacity="0.9"/>
          <circle cx="58" cy="24" r="3.5" fill="white" opacity="0.9"/>
          <circle cx="27" cy="22" r="2.5" fill="white" opacity="0.9"/>
          <circle cx="64" cy="38" r="3" fill="white" opacity="0.7"/>
          <path d="M12 50 L50 50 L30 80 Z" fill="rgba(255,255,255,0.1)"/>
          <path d="M50 50 L88 50 L70 80 Z" fill="rgba(0,0,0,0.08)"/>
        </svg>
      </div>
      <div class="shadow-pulse" style="position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:80px;height:12px;background:rgba(0,0,0,0.15);border-radius:50%;filter:blur(4px);"></div>
    </div>

    <div style="font-size:0.7rem;font-weight:800;letter-spacing:0.3em;text-transform:uppercase;color:var(--primary);margin-bottom:1rem;">404 Error</div>

    <h1 style="font-family:'Playfair Display',serif;font-weight:900;font-size:clamp(3rem,10vw,5.5rem);color:var(--text-base);line-height:0.95;letter-spacing:-0.02em;margin-bottom:1.25rem;">
      SLICE<br><span style="color:var(--primary);">NOT FOUND</span>
    </h1>

    <p style="color:var(--text-muted);font-size:1rem;line-height:1.8;margin-bottom:2.5rem;max-width:420px;margin-left:auto;margin-right:auto;">
      Oops! Looks like this page went missing from our kitchen. It may have been moved, renamed, or never existed. Let's get you back to the good stuff!
    </p>

    <div style="display:flex;flex-wrap:wrap;gap:0.85rem;justify-content:center;margin-bottom:3rem;">
      <a href="index.html" class="btn-primary">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Back to Home
      </a>
      <a href="menu.html" class="btn-secondary">
        <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        Browse Menu
      </a>
    </div>

    <!-- Quick nav links -->
    <div style="border-top:1px solid var(--border-lt);padding-top:2rem;margin-top:0.5rem;">
      <p style="font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.15em;color:var(--text-muted);margin-bottom:1rem;">Quick Navigation</p>
      <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0.75rem;max-width:340px;margin:0 auto;">
        <a href="about.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
          About Us
        </a>
        <a href="services.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/><rect x="9" y="11" width="14" height="10" rx="1"/></svg>
          Services
        </a>
        <a href="contact.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13 19.79 19.79 0 0 1 1.61 4.44 2 2 0 0 1 3.6 2.24h3a2 2 0 0 1 2 1.72c.13.96.34 1.9.65 2.82a2 2 0 0 1-.45 2.11L7.91 9.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45c.92.31 1.86.52 2.82.65A2 2 0 0 1 21.72 17z"/></svg>
          Contact
        </a>
        <a href="login.html" class="card" style="padding:0.85rem;display:flex;align-items:center;gap:0.6rem;font-size:0.8rem;font-weight:700;text-decoration:none;color:var(--text-base);">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="var(--primary)" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          Sign In
        </a>
      </div>
    </div>
  </div>

  <script src="components.js"></script>
  <script>
    const t = localStorage.getItem('sd_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (t === 'dark' || (!t && prefersDark)) document.documentElement.classList.add('dark');
    const d = localStorage.getItem('sd_dir');
    if (d === 'rtl') { document.documentElement.setAttribute('dir','rtl'); const b=document.getElementById('err-dir-btn'); if(b)b.textContent='RTL'; }
  </script>
  <style>
    .dark body { background: var(--bg-dark); }
  </style>
</body>
</html>
