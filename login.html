<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Slice & Dice account to access order history, loyalty rewards, and exclusive deals.">
  <title>Sign In | Slice & Dice — Pizza & Fast Food</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body style="min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;background:var(--bg-alt);overflow-x:clip;padding:2rem 1.25rem 1.5rem;box-sizing:border-box;">

  <!-- Background orbs -->
  <div class="auth-bg-orb-1"></div>
  <div class="auth-bg-orb-2"></div>
  <!-- Subtle food bg -->
  <div style="position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;">
    <img src="assets/images/hero_pizza.png" alt="" style="width:100%;height:100%;object-fit:cover;opacity:0.04;">
  </div>

  <!-- Top-right controls -->
  <div class="auth-top-controls">
    <button id="login-dir-btn" onclick="toggleDir()" class="nav-icon-btn" title="Toggle Direction">LTR</button>
    <button onclick="toggleTheme()" class="nav-icon-btn" aria-label="Toggle theme">
      <span id="login-theme-icon">
        <i class="fa-solid fa-moon"></i>
      </span>
    </button>
  </div>

  <!-- Card -->
  <div style="position:relative;z-index:10;width:100%;max-width:420px;margin:0 auto;padding:1.5rem 0;">
    <div class="auth-card">

      <!-- Logo -->
      <a href="index.html" class="logo-bounce" style="display:flex;align-items:center;justify-content:center;gap:0.65rem;margin-bottom:2rem;text-decoration:none;" aria-label="Slice & Dice Home">
        <div class="nav-logo-icon" style="width:46px;height:46px;">
          <i class="fa-solid fa-pizza-slice"></i>
        </div>
        <div style="display:flex;flex-direction:column;line-height:1;">
          <span class="nav-logo-name" style="font-size:1.25rem;">Slice&amp;<span>Dice</span></span>
          <span style="font-size:0.52rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--text-muted);">Pizza &amp; Fast Food</span>
        </div>
      </a>

      <h1 style="font-family:'Playfair Display',serif;font-size:1.75rem;font-weight:900;text-align:center;margin-bottom:0.35rem;">Welcome Back!</h1>
      <p style="text-align:center;font-size:0.85rem;color:var(--text-muted);margin-bottom:1.75rem;line-height:1.6;">Sign in to access your order history, loyalty points and exclusive deals.</p>

      <!-- Social Login -->
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;margin-bottom:1.25rem;direction:ltr;">
        <button style="display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.7rem;border:1.5px solid var(--border-lt);border-radius:0.65rem;background:none;cursor:pointer;font-size:0.75rem;font-weight:600;color:var(--text-base);font-family:'DM Sans',sans-serif;transition:background 0.2s,border-color 0.2s;" onmouseover="this.style.background='var(--bg-alt)'" onmouseout="this.style.background='none'">
          <i class="fa-brands fa-google"></i>
          Google
        </button>
        <button style="display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.7rem;border:1.5px solid var(--border-lt);border-radius:0.65rem;background:none;cursor:pointer;font-size:0.75rem;font-weight:600;color:var(--text-base);font-family:'DM Sans',sans-serif;transition:background 0.2s,border-color 0.2s;" onmouseover="this.style.background='var(--bg-alt)'" onmouseout="this.style.background='none'">
          <i class="fa-brands fa-apple"></i>
          Apple
        </button>
        <button style="display:flex;align-items:center;justify-content:center;gap:0.4rem;padding:0.7rem;border:1.5px solid var(--border-lt);border-radius:0.65rem;background:none;cursor:pointer;font-size:0.75rem;font-weight:600;color:var(--text-base);font-family:'DM Sans',sans-serif;transition:background 0.2s,border-color 0.2s;" onmouseover="this.style.background='var(--bg-alt)'" onmouseout="this.style.background='none'">
          <i class="fa-brands fa-facebook-f"></i>
          Meta
        </button>
      </div>

      <div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.25rem;">
        <div style="height:1px;background:var(--border-lt);flex:1;"></div>
        <span style="font-size:0.78rem;color:var(--text-muted);font-weight:500;">or sign in with email</span>
        <div style="height:1px;background:var(--border-lt);flex:1;"></div>
      </div>

      <!-- Form -->
      <form onsubmit="event.preventDefault();window.location.href='index.html';" style="display:flex;flex-direction:column;gap:1rem;">
        <div>
          <label for="login-email" class="form-label">Email Address</label>
          <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required>
        </div>
        <div>
          <label for="login-password" class="form-label">Password</label>
          <div style="position:relative;">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required style="padding-right:3rem;">
            <button type="button" onclick="togglePwd('login-password','login-eye')" class="password-toggle-btn" style="position:absolute;right:0.85rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);display:flex;align-items:center;justify-content:center;" aria-label="Toggle password visibility">
              <span id="login-eye">
                <i class="fa-solid fa-eye"></i>
              </span>
            </button>
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-top:0.25rem;">
          <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;font-size:0.82rem;color:var(--text-muted);">
            <input type="checkbox" id="remember-me" style="accent-color:var(--primary);width:15px;height:15px;border-radius:3px;">
            Remember me
          </label>
          <a href="#" style="font-size:0.82rem;font-weight:700;color:var(--primary);">Forgot Password?</a>
        </div>
        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:0.25rem;">Sign In to Account</button>
      </form>

      <p style="text-align:center;font-size:0.85rem;color:var(--text-muted);margin-top:1.5rem;">
        Don't have an account?
        <a href="signup.html" style="color:var(--primary);font-weight:700;margin-left:0.2rem;">Create one →</a>
      </p>

    </div>
  </div>

  <script src="components.js"></script>
  <script>
    const t = localStorage.getItem('sd_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const isDark = t === 'dark' || (!t && prefersDark);
    if (isDark) document.documentElement.classList.add('dark');
    if (typeof updateThemeIcons === 'function') updateThemeIcons(isDark);
    const d = localStorage.getItem('sd_dir') || 'ltr';
    document.documentElement.setAttribute('dir', d);
    const b = document.getElementById('login-dir-btn');
    if (b) b.textContent = d.toUpperCase();
  </script>
  <style>
    .dark-invert { color: #fff; }
    .dark .dark-invert { color: #fff; }
    body:not(.dark) .dark-invert { color: var(--secondary); }
  </style>
</body>
</html>
